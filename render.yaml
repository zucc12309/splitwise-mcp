# Initial deployment is deliberately locked: no account access, MCP, or database.
# Configure private credentials/storage and migrate explicitly before changing
# SW_SETUP_ONLY to false. See docs/operations.md.
services:
  - type: web
    name: personal-splitwise-mcp
    runtime: python
    plan: free
    region: singapore
    branch: codex/initial-implementation
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.lock && pip install --no-deps .
    startCommand: splitwise-mcp serve
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: SW_REMOTE
        value: "true"
      - key: SW_SETUP_ONLY
        value: "true"
      - key: SW_ENABLE_WRITES
        value: "false"
# Add SW_OWNER, SW_ACCOUNT_ID, SW_API_KEY, SW_DATABASE,
# SW_CALLER_TOKEN_SHA256 and SW_ALLOWED_HOST privately in the Dashboard.
# Never store their values in this file or provision a temporary database
# as if it were durable financial execution state.
